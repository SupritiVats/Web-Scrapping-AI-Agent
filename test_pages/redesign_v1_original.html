
<!DOCTYPE html>
<html>
<head>
    <title>Test Store Redesigned</title>
</head>

<body
    style="
        font-family: 'Helvetica Neue', sans-serif;
        background: #1a1a2e;
        color: #eee;
        padding: 0;
        margin: 0;
    "
>
    <header
        style="
            background: #16213e;
            padding: 20px;
            text-align: center;
        "
    >
        <span style="font-size: 28px; letter-spacing: 2px;">
            SHOP
        </span>
    </header>

    <section
        class="xj9-k2p"
        style="
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 40px;
        "
    >
        <!-- Product 1: Trail Running Shoes -->
        <article class="qz3-card-al">
            <figure style="margin: 0;">
                <img
                    src="https://via.placeholder.com/120"
                    alt="Trail Running Shoes"
                    style="border-radius: 12px;"
                >
            </figure>

            <div class="qz3-body">
                <span
                    style="
                        display: block;
                        font-size: 18px;
                        font-weight: 600;
                    "
                >
                    Trail Running Shoes
                </span>

                <div style="margin: 8px 0;">
                    <s style="opacity: 0.5;">$120.00</s>

                    <b
                        style="
                            color: #ff6b6b;
                            margin-left: 6px;
                        "
                    >
                        $89.00
                    </b>
                </div>

                <div
                    class="qz3-meta"
                    style="font-size: 13px; color: #aaa;"
                >
                    **** (4.5)
                </div>

                <div
                    class="qz3-avail"
                    style="font-size: 13px; color: #4ade80;"
                >
                    Available now
                </div>
            </div>
        </article>

        <!-- Product 2: Wireless Earbuds Pro -->
        <article class="qz3-card-a1">
            <figure style="margin: 0;">
                <img
                    src="https://via.placeholder.com/120"
                    alt="Wireless Earbuds Pro"
                    style="border-radius: 12px;"
                >
            </figure>

            <div class="qz3-body">
                <span
                    style="
                        display: block;
                        font-size: 18px;
                        font-weight: 600;
                    "
                >
                    Wireless Earbuds Pro
                </span>

                <div style="margin: 8px 0;">
                    <b style="color: #ff6b6b;">
                        $59.00
                    </b>
                </div>

                <div
                    class="qz3-meta"
                    style="font-size: 13px; color: #aaa;"
                >
                    ***** (4.0)
                </div>

                <div
                    class="qz3-avail"
                    style="font-size: 13px; color: #f87171;"
                >
                    Currently unavailable
                </div>
            </div>
        </article>

        <!-- Product 3: Ceramic Coffee Mug -->
        <article class="qz3-card-a1">
            <figure style="margin: 0;">
                <img
                    src="https://via.placeholder.com/120"
                    alt="Ceramic Coffee Mug"
                    style="border-radius: 12px;"
                >
            </figure>

            <div class="qz3-body">
                <span
                    style="
                        display: block;
                        font-size: 18px;
                        font-weight: 600;
                    "
                >
                    Ceramic Coffee Mug
                </span>

                <div style="margin: 8px 0;">
                    <b style="color: #ff6b6b;">
                        $14.00
                    </b>
                </div>

                <div
                    class="qz3-meta"
                    style="font-size: 13px; color: #aaa;"
                >
                    ***** (4.8)
                </div>

                <div
                    class="qz3-avail"
                    style="font-size: 13px; color: #4ade80;"
                >
                    Available now
                </div>
            </div>
        </article>
    </section>
</body>
</html>
